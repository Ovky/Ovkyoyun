<script type="text/babel">
   window.__firebase_config = JSON.stringify({

    const generateQuizData = async (questionCount = 10, category = 'Genel Kültür', excludedThemes = []) => {
        const exclusionPrompt = excludedThemes.length > 0 ? `Daha önce sorulan temalardan (${excludedThemes.join(', ').substring(0, 500)}) KAÇININ. Cevabın yalnızca JSON formatında olmalıdır.` : 'Cevabın yalnızca JSON formatında olmalıdır.';

        const apiKey = ""; const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

        const responseSchema = { type: "ARRAY", items: { type: "OBJECT", properties: { "question": { "type": "STRING" }, "options": { type: "ARRAY", items: { type: "OBJECT", properties: { "text": { "type": "STRING" }, "rationale": { "type": "STRING" } }, required: ["text", "rationale"] } }, "correctIndex": { "type": "INTEGER" } }, required: ["question", "options", "correctIndex"] } };

        const payload = { contents: [{ parts: [{ text: userQuery }] }], systemInstruction: { parts: [{ text: `Soruların zorluk seviyesi artan bir sırada olmalıdır. İlk %30 'Kolay', sonraki %40 'Orta', son %30 'Zor' olmalıdır. ${category} kategorisine odaklan. ${exclusionPrompt}` }] }, generationConfig: { responseMimeType: "application/json", responseSchema: responseSchema, temperature: 0.7 } };

        try {
            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });

            if (result.candidates && result.candidates.length > 0 && result.candidates[0].content && result.candidates[0].content.parts) {
                const parsedData = JSON.parse(result.candidates[0].content.parts[0].text);
                return parsedData.slice(0, questionCount);
            }
            throw new Error("API, geçerli bir JSON yapısı döndürmedi.");
        } catch (error) {
            console.error("Quiz API Hatası:", error);

        }
    };

    const analyzePerformance = async (quizData, score, totalQuestions) => {
        const answeredQuestions = quizData.map((q, index) => ({ question: q.question, correct: q.answeredIndex === q.correctIndex, difficulty: index < totalQuestions * 0.3 ? 'Kolay' : (index < totalQuestions * 0.7 ? 'Orta' : 'Zor') }));
        const userQuery = `Kullanıcı ${totalQuestions} sorudan oluşan bir bilgi yarışmasında ${score} puan aldı. İşte sorular ve cevap durumları: ${JSON.stringify(answeredQuestions)}. Raporda: 1. Güçlü olduğu zorluk seviyelerini belirt. 2. Geliştirmesi gereken zorluk seviyeleri veya genel temaları belirt. 3. Sonuç odaklı bir geri bildirim sağla.`;
        const apiKey = ""; const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const payload = { contents: [{ parts: [{ text: userQuery }] }], systemInstruction: { parts: [{ text: "Sen bir quiz koçusun. Kibar, motive edici ve yapıcı bir dille geri bildirim sağla." }] }, generationConfig: { temperature: 0.8 } };

        try {
            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await response.json();
            return result.candidates?.[0]?.content?.parts?.[0]?.text || "Analiz alınamadı, lütfen tekrar deneyin.";
        } catch (error) {
            console.error("Analiz API Hatası:", error);
            return "API'ye erişim sırasında hata oluştu. Lütfen bağlantınızı kontrol edin.";
        }
    };

    const generateNickname = async (selectedAvatar) => {
        const userQuery = `Bu avatar (${selectedAvatar}) için, eğlenceli ve yaratıcı, 15 karakteri geçmeyen, tek kelimelik bir takma ad (nickname) öner. Cevabın sadece takma ad olmalıdır.`;
        const apiKey = ""; const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const payload = { contents: [{ parts: [{ text: userQuery }] }], generationConfig: { temperature: 0.9 } };
        try {
            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await response.json();
            const rawNickname = result.candidates?.[0]?.content?.parts?.[0]?.text || "YapayZekaKoç";
            return rawNickname.trim().replace(/['".,]/g, '').substring(0, 15);
        } catch (error) {
            console.error("Nickname API Hatası:", error);
            return "HataNick";
        }
    };
    
    const getDeepExplanation = async (question) => {
        const userQuery = `Aşağıdaki bilgi yarışması sorusunun konusunu (cevap vermeden) kısaca ve eğitici bir şekilde açıkla. Cevabın 3 cümleyi geçmesin. Soru: "${question}"`;
        const apiKey = ""; const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        const payload = { contents: [{ parts: [{ text: userQuery }] }], systemInstruction: { parts: [{ text: "Kısa ve eğitici bilgi özetleri sağla." }] }, generationConfig: { temperature: 0.5 } };
        try {
            const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const result = await response.json();
            return result.candidates?.[0]?.content?.parts?.[0]?.text || "Açıklama alınamadı.";
        } catch (error) {
            console.error("Açıklama API Hatası:", error);
            return "Açıklama yüklenirken bir hata oluştu.";
        }
    };
    const App = () => {
        const [db, setDb] = useState(null);
        const [auth, setAuth] = useState(null);
        const [userId, setUserId] = useState(null);
        const [isAuthReady, setIsAuthReady] = useState(false);
        const [error, setError] = useState(null);
        const [loading, setLoading] = useState(false);
        const [localNickname, setLocalNickname] = useState('');
        const [selectedAvatar, setSelectedAvatar] = useState(AVATAR_LIST[0]); 
        const [gameMode, setGameMode] = useState('menu'); 
        const [roomId, setRoomId] = useState(null);
        const [roomData, setRoomData] = useState(null);
        const [deepExplanation, setDeepExplanation] = useState(null); 
        const [singlePlayerGame, setSinglePlayerGame] = useState({
            status: 'setup', quizData: [], currentIndex: 0, score: 0, questionCount: 10, selectedCategory: 'General', analysisResult: null
        });
        const [activeRooms, setActiveRooms] = useState([]);
        const [soloHistory, setSoloHistory] = useState([]);

        const handleGoToMenu = () => {
            setGameMode('menu'); setRoomId(null); setRoomData(null); setDeepExplanation(null); setActiveRooms([]); setError(null);
            setSinglePlayerGame(prev => ({ ...prev, status: 'setup', quizData: [], currentIndex: 0, score: 0, analysisResult: null }));
        };
        
        const isHost = useMemo(() => { return roomData && roomData.hostId === userId; }, [roomData, userId]);
        const getNickname = useCallback((id) => { return (roomData?.players?.[id]?.nickname || `Oyuncu ${id.substring(0, 4)}`); }, [roomData]);
        const getPlayerAvatar = useCallback((id) => { return getAvatarUrl(roomData?.players?.[id]?.avatar || AVATAR_LIST[0]); }, [roomData]);
        const getCategoryIcon = useCallback((key) => { return CATEGORIES.find(c => c.key === key) ? CATEGORIES.find(c => c.key === key).icon : List; }, []);
        
        // Firebase Auth ve Listener Hook'ları
        useEffect(() => {
            if (Object.keys(firebaseConfig).length === 0) { setError("Firebase yapılandırması eksik."); setIsAuthReady(true); return; }
            try {
                if (!app) { app = initializeApp(firebaseConfig); }
                const firestoreDb = getFirestore(app); const firebaseAuth = getAuth(app); setDb(firestoreDb); setAuth(firebaseAuth);
                const unsubscribe = onAuthStateChanged(firebaseAuth, async (user) => {
                    if (!user) { try { if (initialAuthToken) { await signInWithCustomToken(firebaseAuth, initialAuthToken); } else { await signInAnonymously(firebaseAuth); } } catch (e) { setError("Kullanıcı doğrulama başarısız."); } } else { setUserId(user.uid); }
                    setIsAuthReady(true);
                });
                return () => unsubscribe();
            } catch (e) { setError("Firebase hizmetleri başlatılamadı."); setIsAuthReady(true); }
        }, []);

        useEffect(() => { if (!db || !roomId || gameMode !== 'online') return; const roomDocRef = doc(db, `artifacts/${appId}/public/data/rooms`, roomId); const unsubscribe = onSnapshot(roomDocRef, (docSnap) => { if (docSnap.exists()) { setRoomData(docSnap.data()); setDeepExplanation(null); } else { setRoomId(null); setRoomData(null); setGameMode('onlineLobby'); setError("Oda bağlantısı koptu veya oda silindi."); } }, (e) => { setError("Oda verileri alınamadı."); }); return () => unsubscribe(); }, [db, roomId, gameMode]);
        useEffect(() => { if (!db || gameMode !== 'onlineLobby') return; const roomsCollRef = collection(db, `artifacts/${appId}/public/data/rooms`); const q = query(roomsCollRef, where("status", "==", "waiting")); const unsubscribe = onSnapshot(q, (snapshot) => { setActiveRooms(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }))); }, (e) => { console.error("Genel Lobi Dinleme Hatası:", e); }); return () => unsubscribe(); }, [db, gameMode]);
        useEffect(() => { if (!db || !userId) return; const historyCollRef = collection(db, `artifacts/${appId}/users/${userId}/solo_history`); const q = query(historyCollRef); const unsubscribe = onSnapshot(q, (snapshot) => { const historyData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); historyData.sort((a, b) => b.score - a.score); setSoloHistory(historyData); }, (e) => { console.error("Tek kişilik skor geçmişi alınamadı:", e); }); return () => unsubscribe(); }, [db, userId]);
        useEffect(() => { if (!db || !roomId || !isHost || roomData?.status !== 'playing' || !roomData?.questionStartTime) return; const allAnswered = roomData.players && Object.values(roomData.players).every(p => p.latestAnswerTime !== null); const timeElapsed = (new Date().getTime() - roomData.questionStartTime) / 1000; if (allAnswered || timeElapsed >= ANSWER_WINDOW_SECONDS) { const timeout = setTimeout(() => { handleNextQuestionOnline(); }, 1000); return () => clearTimeout(timeout); } }, [db, roomId, isHost, roomData]);

        // --- Online İşlevleri (Kısa) ---
        const handleCreateRoom = async (questionCount, category) => { 
            if (!db || !userId || localNickname.trim() === '' || !selectedAvatar) return; setLoading(true); setError(null);
            try { 
                const uniqueCode = generateRoomCode(); const newRoomRef = doc(db, `artifacts/${appId}/public/data/rooms`, uniqueCode);
                const categoryLabel = CATEGORIES.find(c => c.key === category).label;
                const initialRoomData = { code: uniqueCode, hostId: userId, status: 'waiting', currentQuestionIndex: -1, quizData: [], questionCount: questionCount, category: categoryLabel, players: { [userId]: { score: 0, latestAnswerTime: null, isHost: true, nickname: localNickname.trim(), avatar: selectedAvatar } } };
                await setDoc(newRoomRef, initialRoomData); setRoomId(uniqueCode); setGameMode('online'); 
            } catch (e) { setError("Oda oluşturulurken bir hata oluştu: " + e.message); } finally { setLoading(false); }
        };
        const handleJoinRoomByClick = async (roomID) => { 
            if (!db || !userId || localNickname.trim() === '' || !selectedAvatar) return; setLoading(true); setError(null);
            try { 
                const roomDocRef = doc(db, `artifacts/${appId}/public/data/rooms`, roomID); const roomDoc = await roomDocRef.get();
                if (!roomDoc.exists) { setError("Oda bulunamadı veya silinmiş."); setLoading(false); return; }
                const roomData = roomDoc.data();
                if (roomData.status !== 'waiting') { setError("Oyun zaten başladı."); setLoading(false); return; }
                const newPlayers = { ...roomData.players, [userId]: { score: roomData.players?.[userId]?.score || 0, latestAnswerTime: null, isHost: roomData.hostId === userId, nickname: localNickname.trim(), avatar: selectedAvatar } };
                await updateDoc(roomDocRef, { players: newPlayers }); setRoomId(roomDoc.id); setGameMode('online'); 
            } catch (e) { setError("Odaya katılırken bir hata oluştu. Lütfen tekrar deneyin."); } finally { setLoading(false); }
        };
        const handleStartGame = async () => { /* ... (Oyunu Başlatma) ... */ };
        const handleAnswerQuestionOnline = async (selectedIndex) => { /* ... (Online Cevaplama) ... */ };
        const handleNextQuestionOnline = async () => { /* ... (Sonraki Soru) ... */ };

        // --- Tek Kişilik İşlevleri (Kısa) ---
        const saveSoloGameResult = async (finalScore, count, category, nick, avatarUrl, quizHistory) => { /* ... (Skor Kaydetme) ... */ };
        const handleStartSinglePlayer = async () => { /* ... (Tek Kişilik Başlatma) ... */ };
        const handleAnswerSinglePlayer = (selectedIndex) => { /* ... (Tek Kişilik Cevaplama) ... */ };
        const handleNextSinglePlayer = async () => { /* ... (Tek Kişilik Sonraki Soru) ... */ };
        const handleAnalyzePerformance = async () => { /* ... (Performans Analizi) ... */ };
        const handleNicknameSuggestion = async () => { /* ... (Takma Ad Önerisi) ... */ };
        const CategorySelector = ({ selectedCategory, onSelectCategory }) => {
        return (
            <div className="my-4">
                <label className="block text-sm font-medium text-gray-700 mb-2">Kategori Seçin:</label>
                <div className="flex flex-wrap justify-center gap-2">
                    {CATEGORIES.map((category) => {
                        const Icon = category.icon;
                        return (<button key={category.key} onClick={() => onSelectCategory(category.key)} className={`flex items-center px-3 py-2 text-sm rounded-lg font-semibold transition-all ${selectedCategory === category.key ? 'bg-purple-600 text-white shadow-lg' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
                                <Icon className="w-4 h-4 mr-1" /> {category.label}
                            </button>);
                    })}
                </div>
            </div>
        );
    };
    
    const QuestionCountSelector = ({ selectedCount, onSelectCount }) => {
         return (
            <div className="my-4">
                <label className="block text-sm font-medium text-gray-700 mb-2">Soru Sayısı:</label>
                <div className="flex justify-center space-x-2">
                    {[10, 15, 20].map((count) => (
                        <button key={count} onClick={() => onSelectCount(count)} className={`px-4 py-2 rounded-lg font-semibold transition-all ${selectedCount === count ? 'bg-indigo-600 text-white shadow-lg' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>{count} Soru</button>
                    ))}
                </div>
            </div>
        );
    };
    
    const PlayerList = ({ players, userId, hostId, showAnswers = false, isOnlineGame = false }) => {
        const sortedPlayers = Object.entries(players || {}).map(([id, data]) => ({ id, ...data })).sort((a, b) => b.score - a.score);

        return (
            <div className="space-y-2">
                {isOnlineGame && <h3 className="text-sm font-bold text-gray-500 mb-2">CANLI SKOR TABLOSU</h3>}
                {sortedPlayers.map((player) => {
                    const isMe = player.id === userId;
                    const isHostPlayer = player.id === hostId;
                    const isAnswered = player.latestAnswerTime !== null;

                    return (
                        <div key={player.id} className={`flex items-center justify-between p-3 rounded-xl shadow-sm transition-all duration-300 ${isMe ? 'bg-indigo-100 border-2 border-indigo-400' : 'bg-white border border-gray-200'}`}>
                            <div className="flex items-center space-x-3 truncate">
                                <img src={getAvatarUrl(player.avatar)} alt="avatar" className="w-8 h-8 rounded-full border-2 border-indigo-300 flex-shrink-0" onError={(e) => e.target.src = getAvatarUrl(AVATAR_LIST[0])} />
                                {isHostPlayer && <Crown className="w-4 h-4 text-yellow-500 flex-shrink-0" />}
                                <span className={`font-semibold text-sm truncate ${isMe ? 'text-indigo-700' : 'text-gray-800'}`} title={player.nickname}>{player.nickname} {isMe ? '(Siz)' : ''}</span>
                                {isOnlineGame && <span className="text-xs text-gray-500 flex-shrink-0">{`(${player.id ? player.id.substring(0, 4) : '??'}...)`}</span>}
                            </div>
                            <div className="flex items-center space-x-4 flex-shrink-0">
                                {showAnswers && isOnlineGame ? (player.isCorrect ? <Check className="w-5 h-5 text-green-500" /> : <X className="w-5 h-5 text-red-500" />) : isOnlineGame && isAnswered ? (<Zap className="w-4 h-4 text-indigo-500" title="Cevapladı" />) : isOnlineGame ? (<span className="w-4 h-4 text-gray-400"></span>) : null}
                                <span className="text-lg font-bold text-gray-900">{player.score}</span>
                            </div>
                        </div>
                    );
                })}
            </div>
        );
    };
        const RenderMenu = () => (
        <div className="max-w-md mx-auto p-8 bg-white rounded-3xl shadow-2xl mt-16 text-center">
            <h1 className="text-4xl font-extrabold text-indigo-600 mb-6">{APP_NAME}</h1><p className="text-gray-600 mb-8">Nasıl oynamak istersiniz?</p>{error && <ErrorDisplay message={error} />}
            <div className="space-y-6">
                <div className="mb-6"><h3 className="text-lg font-semibold text-gray-700 mb-3 flex items-center justify-center">Avatarını Seç</h3><div className="flex flex-wrap justify-center gap-2">
                        {AVATAR_LIST.map((avatarSeed, index) => (<img key={index} src={getAvatarUrl(avatarSeed)} alt={`avatar-${index}`} className={`w-12 h-12 rounded-full cursor-pointer border-2 transition-all ${selectedAvatar === avatarSeed ? 'border-indigo-600 ring-2 ring-indigo-300' : 'border-gray-300 hover:border-indigo-400'}`} onClick={() => setSelectedAvatar(avatarSeed)} onError={(e) => e.target.src = getAvatarUrl(AVATAR_LIST[0])}/>))}
                    </div></div>
                <div className="relative"><input type="text" placeholder="Takma Adınız (Nick)" value={localNickname} onChange={(e) => setLocalNickname(e.target.value)} className="w-full px-4 py-3 pr-14 border border-gray-300 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 transition duration-150" maxLength={15} />
                    <button onClick={handleNicknameSuggestion} disabled={loading} className="absolute right-0 top-0 h-full px-3 text-indigo-600 hover:text-indigo-800 disabled:opacity-50" title="AI'dan Takma Ad Önerisi Al">{loading ? <Loader className="w-5 h-5 animate-spin"/> : 'AI'}</button>

                <button onClick={() => setGameMode('onlineLobby')} disabled={localNickname.trim() === '' || !selectedAvatar} className="w-full flex items-center justify-center px-6 py-3 border border-transparent text-lg font-medium rounded-xl shadow-lg text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 transition duration-150 transform hover:scale-[1.01]"><Users className="w-5 h-5 mr-2" />Online Oyna</button>
            </div>
        </div>
    );

    const RenderOnlineLobby = () => {
        const [questionCount, setQuestionCount] = useState(10);
        const [selectedCategory, setSelectedCategory] = useState('General');
        const formatTimestamp = (ts) => { if (!ts || !ts.seconds) return 'Bilinmiyor'; const date = new Date(ts.seconds * 1000); return date.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }); };

        return (
            <div className="max-w-4xl mx-auto p-8 bg-white rounded-3xl shadow-2xl mt-10">
                <button onClick={handleGoToMenu} className="flex items-center text-sm text-indigo-600 hover:underline mb-4"><Home className="w-4 h-4 mr-1"/>Ana Menü</button>
                <h2 className="text-3xl font-bold text-indigo-600 mb-6 text-center">Genel Lobi</h2>{error && <ErrorDisplay message={error} />}
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-1 p-4 border border-gray-200 rounded-xl shadow-md">
                        <h3 className="text-xl font-semibold text-center mb-4">Yeni Oda Kur</h3>
                        <CategorySelector selectedCategory={selectedCategory} onSelectCategory={setSelectedCategory} />
                        <QuestionCountSelector selectedCount={questionCount} onSelectCount={setQuestionCount} />
                        <button onClick={() => handleCreateRoom(questionCount, selectedCategory)} disabled={loading} className="w-full mt-4 flex items-center justify-center px-6 py-3 text-base font-medium rounded-xl shadow-sm text-white bg-green-600 hover:bg-green-700 disabled:opacity-50">
                            {loading ? <Loader className="w-5 h-5 animate-spin" /> : <Play className="w-5 h-5 mr-2" />}Oda Kur ve Başlat</button>
                    </div>

                    <div className="lg:col-span-2 p-4 border border-gray-200 rounded-xl shadow-md">
                        <h3 className="text-xl font-semibold text-center mb-4">Açık Odalar ({activeRooms.length})</h3>
                        <div className="space-y-3 max-h-96 overflow-y-auto">
                            {activeRooms.length === 0 ? (<p className="text-center text-gray-500 p-4">Şu anda açık oda bulunmamaktadır. Hemen bir oda kur!</p>) : (
                                activeRooms.map(room => {
                                    const hostNickname = room.players[room.hostId]?.nickname || "Bilinmeyen Host";
                                    const CategoryIcon = getCategoryIcon(CATEGORIES.find(c => c.label === room.category)?.key || 'General');
                                    return (<div key={room.id} className="flex items-center justify-between p-3 bg-indigo-50 rounded-lg border border-indigo-200 shadow-sm">
                                            <div className="flex items-center space-x-3"><img src={getAvatarUrl(room.players[room.hostId]?.avatar)} alt="host avatar" className="w-8 h-8 rounded-full border-2 border-indigo-400" />
                                                <div className="text-left"><p className="font-bold text-gray-800">{hostNickname}</p><p className="text-sm text-gray-600 flex items-center">
                                                        <CategoryIcon className="w-4 h-4 mr-1"/> {room.category} ({room.questionCount} Soru)
                                                    </p></div></div>
                                            <button onClick={() => handleJoinRoomByClick(room.id)} disabled={loading || room.hostId === userId} className="px-4 py-2 text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400">
                                                {room.hostId === userId ? "Odam (Bekleniyor)" : `Katıl (${Object.keys(room.players).length})`}
                                            </button></div>);
                                })
                            )}
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    const RenderOnlineGame = () => {
        const onlineGameState = roomData ? roomData.status : 'lobby';
        if (onlineGameState === 'lobby' || !roomId) { return <RenderOnlineLobby />; }
        
        if (onlineGameState === 'waiting') { /* ... (Bekleme ekranı kodu) ... */ return (
             <div className="max-w-2xl mx-auto p-8 bg-white rounded-3xl shadow-2xl mt-10">
                    <button onClick={handleGoToMenu} className="flex items-center text-sm text-indigo-600 hover:underline mb-4"><Home className="w-4 h-4 mr-1"/>Ana Menüden Ayrıl</button>
                    <h1 className="text-3xl font-bold text-gray-800 mb-6 text-center">Bekleme Odası</h1>
                    <div className="flex justify-between items-center bg-indigo-50 p-4 rounded-xl mb-6 border border-indigo-200">
                        <div><p className="text-sm text-indigo-600 font-semibold">Oda Kodu (Paylaşın)</p><p className="text-4xl font-extrabold text-indigo-800 tracking-widest">{roomData?.code}</p></div>
                        <button onClick={() => { try { const el = document.createElement('textarea'); el.value = roomData?.code; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el); } catch (err) { alert('Kopyalama başarısız oldu.'); } }} className="p-3 bg-indigo-600 text-white rounded-full hover:bg-indigo-700" title="Kopyala"><Clipboard className="w-5 h-5" /></button>
                    </div>
                    <div className="flex justify-center space-x-6 text-lg text-gray-600 mb-6"><p className="flex items-center">{getCategoryIcon(CATEGORIES.find(c => c.label === roomData?.category)?.key || 'General').render() } Kategori: <span className="font-bold text-purple-600 ml-1">{roomData?.category}</span></p><p>Soru Sayısı: <span className="font-bold text-indigo-600">{roomData?.questionCount}</span></p></div>
                    <h2 className="text-xl font-semibold text-gray-700 mb-4">Katılımcılar ({Object.keys(roomData?.players || {}).length})</h2>
                    <PlayerList players={roomData?.players} userId={userId} hostId={roomData?.hostId} />
                    {isHost ? (<button onClick={handleStartGame} disabled={Object.keys(roomData?.players || {}).length < 1 || loading} className="w-full mt-8 flex items-center justify-center px-6 py-3 text-lg font-medium rounded-xl shadow-lg text-white bg-green-500 hover:bg-green-600 disabled:opacity-50">
                            {loading ? <Loader className="w-5 h-5 animate-spin" /> : <Play className="w-5 h-5 mr-2" />}Oyunu Başlat</button>) : (
                        <p className="mt-8 p-4 text-center bg-yellow-100 text-yellow-800 rounded-xl font-medium">Host'un ({getNickname(roomData?.hostId)}) oyunu başlatması bekleniyor...</p>)}
                </div>
            );
        }
        
        if (onlineGameState === 'playing') { /* ... (Oynama ekranı kodu) ... */ return (
             <div className="max-w-4xl mx-auto p-6">
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 bg-white p-6 rounded-2xl shadow-xl">
                            <div className="flex justify-between items-center mb-6 border-b pb-3">
                                <h2 className="text-2xl font-bold text-indigo-700">Soru {roomData?.currentQuestionIndex + 1}/{roomData?.quizData.length || 0}</h2>
                                <div className={`text-3xl font-extrabold p-3 rounded-full w-12 h-12 flex items-center justify-center transition-colors ${ANSWER_WINDOW_SECONDS - Math.floor((new Date().getTime() - roomData?.questionStartTime) / 1000) <= 5 ? 'bg-red-500 text-white' : 'bg-yellow-400 text-gray-800'}`}>
                                    {Math.max(0, ANSWER_WINDOW_SECONDS - Math.floor((new Date().getTime() - roomData?.questionStartTime) / 1000))}
                                </div>
                            </div>
                            <p className="text-2xl font-semibold mb-8 text-gray-900">{roomData?.quizData[roomData?.currentQuestionIndex]?.question}</p>
                            <div className="space-y-4">
                                {roomData?.quizData[roomData?.currentQuestionIndex]?.options.map((option, index) => {
                                    const showAnswers = roomData.players[userId]?.latestAnswerTime !== null || ANSWER_WINDOW_SECONDS - Math.floor((new Date().getTime() - roomData?.questionStartTime) / 1000) <= 0;
                                    const isCorrectOption = index === roomData?.quizData[roomData?.currentQuestionIndex]?.correctIndex;
                                    const isPlayerAnswer = index === roomData?.players[userId]?.answeredIndex;
                                    let bgColor = 'bg-gray-100 hover:bg-gray-200'; let borderColor = 'border-gray-300'; let cursor = 'cursor-pointer';
                                    if (showAnswers && isCorrectOption) { bgColor = 'bg-green-100'; borderColor = 'border-green-400'; }
                                    if (showAnswers && isPlayerAnswer) { bgColor = isCorrectOption ? 'bg-green-200' : 'bg-red-200'; borderColor = isCorrectOption ? 'border-green-500' : 'border-red-500'; }
                                    if (roomData.players[userId]?.latestAnswerTime !== null || ANSWER_WINDOW_SECONDS - Math.floor((new Date().getTime() - roomData?.questionStartTime) / 1000) <= 0) cursor = 'cursor-default';

                                    return (<button key={index} onClick={() => roomData.players[userId]?.latestAnswerTime === null && ANSWER_WINDOW_SECONDS - Math.floor((new Date().getTime() - roomData?.questionStartTime) / 1000) > 0 && handleAnswerQuestionOnline(index)} disabled={roomData.players[userId]?.latestAnswerTime !== null || ANSWER_WINDOW_SECONDS - Math.floor((new Date().getTime() - roomData?.questionStartTime) / 1000) <= 0} className={`w-full text-left p-4 rounded-xl border-2 transition-colors ${bgColor} ${borderColor} ${cursor} disabled:opacity-100`}>
                                            <span className="font-semibold">{String.fromCharCode(65 + index)}. </span>{option.text}</button>);
                                })}
                            </div>
                            
                            {showAnswers && (
                                <div className="mt-6 p-4 bg-purple-100 border border-purple-300 rounded-xl">
                                    <h3 className="font-bold text-purple-800 mb-2 flex items-center"><Lightbulb className="w-5 h-5 mr-2" /> Doğru Cevap: {roomData.quizData[roomData.currentQuestionIndex].options[roomData.quizData[roomData.currentQuestionIndex].correctIndex].text}</h3>
                                    <button onClick={async () => setDeepExplanation(await getDeepExplanation(roomData.quizData[roomData.currentQuestionIndex].question))} className="mt-2 px-3 py-1 text-sm bg-purple-600 text-white rounded-lg hover:bg-purple-700">Konu Hakkında Bilgi Al (AI)</button>
                                    {deepExplanation && (<p className="mt-2 text-sm text-gray-800 whitespace-pre-wrap">{deepExplanation}</p>)}
                                </div>
                            )}
                        </div>
                        
                        <div className="lg:col-span-1">
                            <h2 className="text-xl font-bold text-gray-800 mb-4">Skor Tablosu</h2>
                            <PlayerList players={roomData?.players} userId={userId} hostId={roomData?.hostId} showAnswers={showAnswers} isOnlineGame={true} />
                        </div>
                    </div>
                    {showAnswers && (<p className="mt-6 p-3 text-center bg-green-100 text-green-800 rounded-xl font-medium flex items-center justify-center">Yeni soruya otomatik geçiliyor.</p>)}
                </div>
            );
        }
        
        if (onlineGameState === 'finished') { /* ... (Online Sonuç Ekranı kodu) ... */ return (
            <div className="max-w-3xl mx-auto p-8 bg-white rounded-3xl shadow-2xl mt-10 text-center">
                <h1 className="text-5xl font-extrabold text-indigo-600 mb-10">Yarışma Bitti!</h1>
                <div className="flex justify-center items-end space-x-2 md:space-x-4 h-64 mb-10">
                    {/* ... (Podyum kodları) ... */}
                </div>
                <button onClick={handleGoToMenu} className="w-full mt-10 px-6 py-3 text-lg font-medium rounded-xl shadow-lg text-white bg-indigo-600 hover:bg-indigo-700">Ana Menüye Dön</button>
            </div>
        ); }
        
        return <div className="text-center mt-10">Online modda bilinmeyen durum...</div>;
    }
        const RenderSinglePlayerGame = () => {
        if (singlePlayerGame.status === 'setup') { /* ... (Tek Kişilik Ayar Ekranı) ... */ return (
                <div className="max-w-lg mx-auto p-8 bg-white rounded-3xl shadow-2xl mt-10">
                    <button onClick={handleGoToMenu} className="flex items-center text-sm text-indigo-600 hover:underline mb-4"><Home className="w-4 h-4 mr-1"/>Ana Menü</button>
                    <h2 className="text-3xl font-bold text-indigo-600 mb-4 text-center">Tek Kişilik Oyun</h2>{error && <ErrorDisplay message={error} />}
                    <CategorySelector selectedCategory={singlePlayerGame.selectedCategory} onSelectCategory={(key) => setSinglePlayerGame(prev => ({ ...prev, selectedCategory: key }))}/>
                    <QuestionCountSelector selectedCount={singlePlayerGame.questionCount} onSelectCount={(count) => setSinglePlayerGame(prev => ({ ...prev, questionCount: count }))} />
                    <button onClick={handleStartSinglePlayer} disabled={loading} className="w-full mt-6 flex items-center justify-center px-6 py-3 text-lg font-medium rounded-xl shadow-lg text-white bg-green-500 hover:bg-green-600 disabled:opacity-50">
                        {loading ? <Loader className="w-5 h-5 animate-spin" /> : <Play className="w-5 h-5 mr-2" />}Başla</button>
                    <div className="mt-8 border-t pt-6"><h3 className="text-xl font-semibold text-gray-700 mb-4 text-center">Geçmiş Skorların (En Yüksek 10)</h3>
                        {soloHistory.length === 0 ? (<p className="text-center text-gray-500">Henüz hiç oyun oynamamışsın.</p>) : (<div className="space-y-2 max-h-64 overflow-y-auto pr-2">
                                {soloHistory.slice(0, 10).map((game, index) => (<div key={game.id} className={`flex items-center justify-between p-3 rounded-lg ${index === 0 ? 'bg-yellow-100 border border-yellow-300' : 'bg-gray-100'}`}>
                                            <div className="flex items-center space-x-3"><span className="font-bold text-gray-600 w-6">{index + 1}.</span>{index === 0 && <Trophy className="w-5 h-5 text-yellow-500" />}
                                                <img src={getAvatarUrl(game.avatar)} alt="avatar" className="w-8 h-8 rounded-full border border-gray-300" onError={(e) => e.target.src = getAvatarUrl(AVATAR_LIST[0])} /><span className="font-semibold text-gray-800">{game.nickname}</span></div>
                                            <div className="flex items-center space-x-4"><span className="text-sm text-gray-500">{game.questionCount} Soru</span><span className="text-sm text-gray-500">{new Date(game.timestamp.seconds * 1000).toLocaleDateString('tr-TR')}</span><span className="text-lg font-bold text-indigo-600">{game.score}</span></div>
                                        </div>))}</div>)}</div></div>);
            }
            
            if (singlePlayerGame.status === 'playing') { /* ... (Tek Kişilik Oynama Ekranı) ... */ return (
                 <div className="max-w-2xl mx-auto p-8 bg-white rounded-3xl shadow-2xl mt-10">
                    <div className="flex justify-between items-center mb-6 border-b pb-3">
                        <h2 className="text-2xl font-bold text-indigo-700">Soru {singlePlayerGame.currentIndex + 1}/{singlePlayerGame.quizData.length}</h2>
                        <div className="text-right"><p className="text-sm text-gray-500">Puan</p><p className="text-3xl font-extrabold text-indigo-700">{singlePlayerGame.score}</p></div>
                        <div className={`text-3xl font-extrabold p-3 rounded-full w-12 h-12 flex items-center justify-center transition-colors ${ANSWER_WINDOW_SECONDS - Math.floor((new Date().getTime() - singlePlayerGame.questionStartTime) / 1000) <= 5 ? 'bg-red-500 text-white' : 'bg-yellow-400 text-gray-800'}`}>
                            {Math.max(0, ANSWER_WINDOW_SECONDS - Math.floor((new Date().getTime() - singlePlayerGame.questionStartTime) / 1000))}
                        </div>
                    </div>
                    <p className="text-2xl font-semibold mb-8 text-gray-900">{singlePlayerGame.quizData[singlePlayerGame.currentIndex].question}</p>
                    <div className="space-y-4">
                        {singlePlayerGame.quizData[singlePlayerGame.currentIndex].options.map((option, index) => {
                            const currentQuestion = singlePlayerGame.quizData[singlePlayerGame.currentIndex];
                            const hasAnswered = currentQuestion.answeredIndex !== null;
                            const isTimeUp = ANSWER_WINDOW_SECONDS - Math.floor((new Date().getTime() - singlePlayerGame.questionStartTime) / 1000) <= 0;
                            const isCorrectOption = index === currentQuestion.correctIndex;
                            const isPlayerAnswer = index === currentQuestion.answeredIndex;
                            let bgColor = 'bg-gray-100 hover:bg-gray-200'; let borderColor = 'border-gray-300'; let cursor = 'cursor-pointer';
                            
                            if ((hasAnswered || isTimeUp) && isCorrectOption) { bgColor = 'bg-green-100'; borderColor = 'border-green-400'; }
                            if (hasAnswered && isPlayerAnswer) { bgColor = isCorrectOption ? 'bg-green-200' : 'bg-red-200'; borderColor = isCorrectOption ? 'border-green-500' : 'border-red-500'; }
                            if (hasAnswered || isTimeUp) cursor = 'cursor-default';
                            
                            return (<button key={index} onClick={() => !hasAnswered && !isTimeUp && handleAnswerSinglePlayer(index)} disabled={hasAnswered || isTimeUp} className={`w-full text-left p-4 rounded-xl border-2 transition-colors ${bgColor} ${borderColor} ${cursor} disabled:opacity-100`}>
                                <span className="font-semibold">{String.fromCharCode(65 + index)}. </span>{option.text}</button>);
                        })}
                    </div>
                    
                    {(singlePlayerGame.quizData[singlePlayerGame.currentIndex].answeredIndex !== null || ANSWER_WINDOW_SECONDS - Math.floor((new Date().getTime() - singlePlayerGame.questionStartTime) / 1000) <= 0) && (
                        <div className="mt-6">
                            <div className={`p-4 rounded-xl mb-4 ${singlePlayerGame.quizData[singlePlayerGame.currentIndex].isCorrect ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                                <h3 className="font-bold mb-2 flex items-center">
                                    {singlePlayerGame.quizData[singlePlayerGame.currentIndex].isCorrect ? <Check className="w-5 h-5 mr-2" /> : <X className="w-5 h-5 mr-2" />}
                                    {singlePlayerGame.quizData[singlePlayerGame.currentIndex].isCorrect ? 'Tebrikler!' : 'Yanlış Cevap!'} (Doğru Şık: {String.fromCharCode(65 + singlePlayerGame.quizData[singlePlayerGame.currentIndex].correctIndex)})
                                </h3>
                            </div>
                            <button onClick={handleNextSinglePlayer} disabled={loading} className="w-full flex items-center justify-center px-6 py-3 text-lg font-medium rounded-xl shadow-lg text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50">
                                {loading ? <Loader className="w-5 h-5 animate-spin" /> : 
                                 (singlePlayerGame.currentIndex + 1 < singlePlayerGame.quizData.length ? <>Sonraki Soru <ArrowRight className="w-5 h-5 ml-2" /></> : 'Bitir ve Skoru Kaydet')}
                            </button>
                        </div>
                    )}
                </div>
            );
            }
            
            if (singlePlayerGame.status === 'finished') { /* ... (Tek Kişilik Sonuç Ekranı) ... */ return (
                 <div className="max-w-md mx-auto p-8 bg-white rounded-3xl shadow-2xl mt-16 text-center">
                    <h1 className="text-5xl font-extrabold text-indigo-600 mb-4">Oyun Bitti!</h1>
                    {singlePlayerGame.score > (soloHistory.length > 0 ? soloHistory[0].score : 0) && (soloHistory.length > 0) && (<div className="p-4 bg-yellow-100 text-yellow-700 rounded-lg mb-6"><Trophy className="w-6 h-6 mx-auto mb-2" /><p className="font-bold">Yeni Yüksek Skor Rekoru!</p></div>)}
                    <p className="text-xl text-gray-600 mb-4">Tebrikler, {localNickname}!</p>
                    <p className="text-2xl text-gray-800 mb-2">Toplam Puanın:</p><p className="text-7xl font-extrabold text-green-600 mb-10">{singlePlayerGame.score}</p>
                    <div className="border-t pt-6 mb-8">
                        <h3 className="text-xl font-semibold text-gray-700 mb-4 flex items-center justify-center"><Lightbulb className="w-5 h-5 mr-2 text-indigo-500" />Performans Analizi (AI)</h3>
                        {singlePlayerGame.analysisResult === "Analiz oluşturuluyor..." && (<p className="flex items-center justify-center text-indigo-600 font-medium"><Loader className="w-5 h-5 mr-2 animate-spin" /> Analiz Oluşturuluyor...</p>)}
                        {singlePlayerGame.analysisResult && singlePlayerGame.analysisResult !== "Analiz oluşturuluyor..." && (<div className="text-left p-4 bg-indigo-50 rounded-xl text-gray-800 whitespace-pre-wrap">{singlePlayerGame.analysisResult}</div>)}
                        {!singlePlayerGame.analysisResult && (<button onClick={handleAnalyzePerformance} disabled={loading} className="w-full flex items-center justify-center px-6 py-3 text-lg font-medium rounded-xl shadow-lg text-white bg-purple-600 hover:bg-purple-700 disabled:opacity-50">✨ Performans Analizi Al</button>)}
                    </div>
                    <div className="space-y-4"><button onClick={() => setSinglePlayerGame(prev => ({ ...prev, status: 'setup', score: 0, currentIndex: 0, quizData: [], analysisResult: null }))} className="w-full px-6 py-3 text-lg font-medium rounded-xl shadow-lg text-white bg-indigo-600 hover:bg-indigo-700">Yeniden Oyna</button>
                        <button onClick={handleGoToMenu} className="w-full px-6 py-3 text-lg font-medium rounded-xl shadow-lg text-indigo-700 bg-indigo-100 hover:bg-indigo-200">Ana Menü</button></div>
                </div>
            );
        }
    };

    // --- ANA RENDER ---
    
    return (
        <div className="min-h-screen bg-gray-50 p-4 font-sans">
            <header className="py-4 text-center">
                <h1 className="text-2xl md:text-3xl font-extrabold text-gray-800">{APP_NAME}</h1>
            </header>
            
            {gameMode === 'menu' && <RenderMenu />}
            {gameMode === 'onlineLobby' && <RenderOnlineLobby />}
            {gameMode === 'online' && <RenderOnlineGame />}
            {gameMode === 'singlePlayer' && <RenderSinglePlayerGame />}
            
            <footer className="text-center mt-10 text-xs text-gray-400">
                Kullanıcı ID: {userId ? userId.substring(0, 10) : '...'}...
            </footer>
        </div>
    );
};

// React uygulamasını başlat
ReactDOM.render(<App />, document.getElementById('root'));
</script>

</body>
</html>
